<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YNAB Raw Data</title>
<style>
  :root {
    --accent: #4f6df5; --accent-soft: #eef1ff;
    --bg: #f3f4f8; --card: #fff; --text: #1c2130; --muted: #8a90a3;
    --green: #1fa971; --red: #e05252;
    --radius: 14px; --shadow: 0 1px 3px rgba(20,24,40,.07), 0 8px 24px rgba(20,24,40,.05);
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  .topbar { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.9); backdrop-filter: blur(8px); border-bottom: 1px solid #e8eaf1; display: flex; align-items: center; gap: 20px; padding: 12px 28px; flex-wrap: wrap; }
  .topbar h1 { font-size: 17px; margin: 0; }
  .nav { display: flex; gap: 8px; }
  .nav a { text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 8px; }
  .nav a.active, .nav a:hover { background: var(--accent-soft); color: var(--accent); }
  .spacer { flex: 1; }
  select, input[type=search], button { padding: 8px 12px; font-size: 13px; border-radius: 9px; border: 1px solid #dde0ea; background: #fff; color: var(--text); }
  input[type=search] { width: 220px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; font-weight: 700; }
  button.green { background: var(--green); border-color: var(--green); color: #fff; cursor: pointer; font-weight: 700; }
  .page { padding: 20px 28px 60px; max-width: 1400px; margin: 0 auto; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 18px; }
  .stat .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .stat .value { font-size: 19px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid #f4f5f9; white-space: nowrap; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); cursor: pointer; user-select: none; position: sticky; top: 0; background: #fff; }
  th:hover { color: var(--accent); }
  td.amount, th.amount { text-align: right; font-variant-numeric: tabular-nums; }
  td.pos { color: var(--green); font-weight: 600; }
  td.neg { color: var(--red); }
  td.memo, td.payeecol { max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
  tr:hover td { background: #fafbff; }
  .scroll { max-height: 72vh; overflow: auto; }
  .muted { color: var(--muted); padding: 20px 28px; font-size: 13px; }
  .error { color: var(--red); padding: 10px 28px; font-weight: 600; }
  .pill { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .pill.Outflow { background: #fdeaea; color: var(--red); }
  .pill.Inflow { background: #e6f7ef; color: var(--green); }
  .pill.Transfer { background: var(--accent-soft); color: var(--accent); }
</style>
</head>
<body>

<div class="topbar">
  <h1>🗃️ Raw Data — full history</h1>
  <div class="nav">
    <a href="/">Dashboard</a>
    <a href="/charts">Charts &amp; Flow</a>
    <a href="/advisor">Advisor</a>
    <a class="active" href="/raw">Raw Data</a>
  </div>
  <div class="spacer"></div>
  <label>Plan <select id="plan"></select></label>
  <input type="search" id="search" placeholder="Search payee / category / account / memo…">
  <button class="green" id="exportBtn">⬇️ Export to Excel (CSV)</button>
</div>

<div id="error" class="error" hidden></div>
<div id="loading" class="muted" hidden>Loading full history…</div>

<div class="page" id="page" hidden>
  <div class="stats">
    <div class="stat"><div class="label">Rows</div><div class="value" id="sRows"></div></div>
    <div class="stat"><div class="label">Date range</div><div class="value" id="sRange" style="font-size:15px"></div></div>
    <div class="stat"><div class="label">Total outflow</div><div class="value" id="sOut" style="color:var(--red)"></div></div>
    <div class="stat"><div class="label">Total inflow</div><div class="value" id="sIn" style="color:var(--green)"></div></div>
    <div class="stat"><div class="label">Net</div><div class="value" id="sNet"></div></div>
  </div>

  <div class="card">
    <div class="scroll">
      <table id="tbl">
        <thead><tr>
          <th data-k="date">Date ↕</th>
          <th data-k="payee">Payee ↕</th>
          <th data-k="category">Category ↕</th>
          <th data-k="account">Account ↕</th>
          <th data-k="type">Type ↕</th>
          <th data-k="memo">Memo</th>
          <th data-k="amount" class="amount">Amount ↕</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <div class="muted" id="capNote" hidden>Showing first 1,000 rows in the browser — the Excel export always contains ALL rows.</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let rows = [], view = [], sortKey = 'date', sortDir = -1;

const fmt = (n) => n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

async function loadPlans() {
  const res = await fetch('/api/plans');
  if (!res.ok) throw new Error('Failed to load plans');
  const plans = await res.json();
  const sel = $('plan'); sel.innerHTML = '';
  for (const p of plans) {
    const o = document.createElement('option'); o.value = p.id; o.textContent = p.name; sel.appendChild(o);
  }
}

function applyView() {
  const q = $('search').value.toLowerCase();
  view = q
    ? rows.filter((r) => (r.payee + ' ' + r.category + ' ' + r.account + ' ' + r.memo).toLowerCase().includes(q))
    : rows.slice();
  view.sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y))) * sortDir;
  });
  renderStats();
  renderTable();
}

function renderStats() {
  const out = view.filter((r) => r.type === 'Outflow').reduce((s, r) => s + Math.abs(r.amount), 0);
  const inn = view.filter((r) => r.type === 'Inflow').reduce((s, r) => s + r.amount, 0);
  $('sRows').textContent = view.length.toLocaleString();
  const dates = view.map((r) => r.date).sort();
  $('sRange').textContent = dates.length ? dates[0] + ' → ' + dates[dates.length - 1] : '—';
  $('sOut').textContent = fmt(out);
  $('sIn').textContent = fmt(inn);
  const net = inn - out;
  $('sNet').textContent = fmt(net);
  $('sNet').style.color = net >= 0 ? 'var(--green)' : 'var(--red)';
}

function renderTable() {
  const tbody = $('tbl').querySelector('tbody');
  tbody.innerHTML = '';
  const cap = 1000;
  $('capNote').hidden = view.length <= cap;
  const frag = document.createDocumentFragment();
  for (const r of view.slice(0, cap)) {
    const tr = document.createElement('tr');
    const amtCls = r.amount < 0 ? 'neg' : 'pos';
    tr.innerHTML =
      `<td>${r.date}</td>` +
      `<td class="payeecol" title="${r.payee.replace(/"/g, '&quot;')}">${r.payee}</td>` +
      `<td>${r.category}</td>` +
      `<td>${r.account}</td>` +
      `<td><span class="pill ${r.type}">${r.type}</span></td>` +
      `<td class="memo" title="${(r.memo || '').replace(/"/g, '&quot;')}">${r.memo || ''}</td>` +
      `<td class="amount ${amtCls}">${fmt(r.amount)}</td>`;
    frag.appendChild(tr);
  }
  tbody.appendChild(frag);
}

async function load() {
  $('error').hidden = true; $('loading').hidden = false; $('page').hidden = true;
  try {
    const res = await fetch(`/api/raw?plan_id=${encodeURIComponent($('plan').value)}`);
    if (!res.ok) throw new Error((await res.json()).error || 'Failed to load raw data');
    const d = await res.json();
    rows = d.rows;
    applyView();
    $('page').hidden = false;
  } catch (e) {
    $('error').textContent = e.message; $('error').hidden = false;
  } finally { $('loading').hidden = true; }
}

$('plan').onchange = load;
$('search').oninput = applyView;
$('exportBtn').onclick = () => {
  window.location.href = `/api/export.csv?plan_id=${encodeURIComponent($('plan').value)}`;
};
document.querySelectorAll('th[data-k]').forEach((th) => {
  th.onclick = () => {
    const k = th.dataset.k;
    if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = k === 'date' || k === 'amount' ? -1 : 1; }
    applyView();
  };
});

(async () => {
  try { await loadPlans(); await load(); }
  catch (e) { $('error').textContent = e.message; $('error').hidden = false; }
})();
</script>
</body>
</html>
